<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog De Café</title>
    <link rel="preload" href="css/normalize.css" as="style">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Open+Sans&amp;family=PT+Sans:wght@400;700&amp;display=swap" crossorigin="crossorigin" as="font">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&amp;family=PT+Sans:wght@400;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/globales.css">
    <link rel="stylesheet" href="css/contacto.css">
</head>
<body>
    <header class="header">
        <div class="contenedor">
            <a href="index.html"><h1 class="logo">Blog<span class="logo-bold">DeCafé</span></h1></a>
            <nav class="nav">
                <a href="nosotros.html">Nosotros</a>
                <a href="cursos.html">Cursos</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
        <div class="header__texto">
            <h2>Blog de café con consejos y cursos</h2>
            <p>Aprende de los expertos con las mejores recetas y consejos</p>
        </div>
    </header>
    <div class="contenedor contenido-principal">
        <h1>Contacto</h1>
        <main class="main">
            <img src="img/contacto.jpg" alt="Contactanos">
            <form class="formulario">
                <label for="nombre">Nombre:</label>
                <input type="text" name="nombre" placeholder="Tu nombre" id="nombre">
                <label for="correo">E-Mail:</label>
                <input type="email" name="correo" placeholder="Tu email" id="correo">
                <label for="mensaje">Mensaje:</label>
                <textarea name="mensaje" id="mensaje"></textarea>
                <input type="submit" id="submit">
            </form>
        </main>
    </div>
    <footer class="footer">
        <div class="contenedor">
            <a href="index.html"><h1 class="logo">Blog<span class="logo-bold">DeCafé</span></h1></a>
            <nav class="nav">
                <a href="nosotros.html">Nosotros</a>
                <a href="cursos.html">Cursos</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </footer>
</body>
</html>
